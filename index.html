
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Travel Planner</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>🌍 Travel Planner</h1>
        <p>Plan your next adventure!</p>
    </header>

    <main>
        <section class="trip-form">
            <h2>Create Your Trip</h2>

            <input type="text" id="tripName"
                   placeholder="Enter trip name">

            <input type="text" id="destination"
                   placeholder="Enter destination">

            <button id="createTrip">Create Trip</button>
        </section>

        <section class="trip-list">
            <h2>My Trips</h2>
            <div id="trips">
                <p>No trips yet. Create your first trip!</p>
            </div>
        </section>
        <section class="map-section">
    <h2>Explore Your Destination</h2>

    <input type="text" id="mapSearch"
           placeholder="Search a city or destination">

    <button id="searchMap">Search Map</button>

    <div id="map"></div>
</section>


<section class="expense-section">
    <h2>💰 All Trips Expense Summary</h2>

    <h3>
        Grand Total: ₹<span id="grandTotal">0.00</span>
    </h3>
</section>

    </main>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="script.js"></script>

</body>
</html>
